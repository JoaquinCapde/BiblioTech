<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bibliotech</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="login-screen">
    <div class="login-card">
      <div class="lh">
        <span class="badge">B</span>
        <h1 class="brand-font">Bibliotech</h1>
        <p>Gestión de préstamos de equipos tecnológicos del colegio.</p>
      </div>
      <div class="lb">
        <div id="form-login">
          <label for="inp-u">Usuario</label>
          <input id="inp-u" type="text" placeholder="Ingresá tu usuario" autocomplete="username" />
          <label for="inp-p">Contraseña</label>
          <input id="inp-p" type="password" placeholder="••••••••" autocomplete="current-password" />
          <p id="lerr">Usuario o contraseña incorrectos.</p>
          <button class="btn-login" id="btn-login">Ingresar al sistema</button>
          <p class="switch-row">¿No tenés cuenta? <button class="link-btn" id="ir-registro">Registrate</button></p>
        </div>

        <div id="form-registro" class="hidden">
          <label for="reg-nombre">Nombre y apellido</label>
          <input id="reg-nombre" type="text" placeholder="Ej: María Pérez" autocomplete="name" />
          <label for="reg-user">Usuario</label>
          <input id="reg-user" type="text" placeholder="Ej: maria.perez" autocomplete="username" />
          <label for="reg-pass">Contraseña</label>
          <input id="reg-pass" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" />
          <label for="reg-pass2">Repetir contraseña</label>
          <input id="reg-pass2" type="password" placeholder="••••••••" autocomplete="new-password" />
          <p id="rerr"></p>
          <button class="btn-login" id="btn-registro">Crear cuenta</button>
          <p class="switch-row">¿Ya tenés cuenta? <button class="link-btn" id="ir-login">Ingresá</button></p>
        </div>
      </div>
    </div>
  </div>

  <div id="app">
    <header>
      <div class="logo">Biblio<span>tech</span></div>
      <nav id="nav"></nav>
      <div class="hr">
        <div class="utag">Rol <b id="ulbl"></b></div>
        <button class="btn-logout" id="btn-logout">Salir</button>
      </div>
    </header>
    <main id="mc"></main>
  </div>
  <div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
